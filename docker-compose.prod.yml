services:
  app:
    build: .
    container_name: donpunto_api_prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: donpunto_db_prod
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-menuqr_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_prod:
